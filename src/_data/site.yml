# Les pages du site : adresse, titre de menu, titre et description pour Google.
pages:
  accueil:
    url: { fr: /, en: /en/ }
    menu: { fr: Accueil, en: Home }
    titre:
      fr: "Nouvelle Fondation : 11 propositions pour réformer l’ONU"
      en: "New Foundation: 11 proposals to reform the United Nations"
    description:
      fr: Réforme de l’ONU, du Conseil de sécurité et du droit de veto, société civile, climat. Onze propositions portées par une coalition d’associations et d’ONG.
      en: UN and Security Council reform, the veto, civil society, climate. Eleven proposals from a coalition of associations around Pax Christi France.
  propositions:
    url: { fr: /propositions/, en: /en/proposals/ }
    menu: { fr: Propositions, en: Proposals }
    titre:
      fr: "Réforme de l’ONU et du Conseil de sécurité : 11 propositions"
      en: "UN and Security Council reform: our 11 proposals"
    description:
      fr: Suspension du droit de veto, Conseil de sécurité représentatif, rôle de l’Assemblée générale, ONG, IA, climat. Nos onze propositions classées en trois temps.
      en: Suspending the veto, a representative Security Council, a stronger General Assembly, NGOs, AI, climate. Our eleven proposals in three stages.
  projet:
    url: { fr: /le-projet/, en: /en/the-project/ }
    menu: { fr: Le projet, en: The project }
    titre:
      fr: "Le projet Nouvelle Fondation des institutions internationales"
      en: "The New Foundation of International Institutions project"
    description:
      fr: Né à l’initiative de Pax Christi, le projet réunit associations, ONG et juristes autour d’un appel à réformer la Charte des Nations unies.
      en: Launched by Pax Christi, the project brings together associations, NGOs and international lawyers calling for a reform of the UN Charter.
  actualites:
    url: { fr: /actualites/, en: /en/news/ }
    menu: { fr: Actualités, en: News }
    titre:
      fr: "Actualités et analyses sur la réforme de l’ONU | Nouvelle Fondation"
      en: "News and analysis on UN reform | New Foundation"
    description:
      fr: Nos articles, prises de position et analyses juridiques sur la réforme des Nations unies et du droit international.
      en: Our articles, positions and legal analyses on reforming the United Nations and international law.
  partenaires:
    url: { fr: /partenaires/, en: /en/partners/ }
    menu: { fr: Partenaires, en: Partners }
    titre:
      fr: "Partenaires et signataires | Nouvelle Fondation"
      en: "Partners and supporters | New Foundation"
    description:
      fr: Article 109, Bureau international de la paix, Pax Christi et les associations qui soutiennent les propositions de Nouvelle Fondation.
      en: Article 109, the International Peace Bureau, Pax Christi and the associations supporting the New Foundation proposals.
  agir:
    url: { fr: /agir/, en: /en/take-action/ }
    menu: { fr: Agir, en: Take action }
    titre:
      fr: "Signer la pétition pour la réforme de l’ONU | Nouvelle Fondation"
      en: "Sign the petition for UN reform | New Foundation"
    description:
      fr: Signez la pétition pour la réforme de l’ONU, à titre individuel ou au nom de votre organisation, et rejoignez le groupe de travail.
      en: Sign the petition for UN reform, as an individual or on behalf of your organisation, and join the working group.

