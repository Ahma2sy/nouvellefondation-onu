conclusion:
  fr: Les trois dernières propositions se heurteront au veto de ceux qu’elles visent. Nous les portons quand même, parce qu’un objectif qu’on renonce à formuler n’a aucune chance d’être atteint.
  en: The last three proposals will run into the veto of those they target. We put them forward anyway, because a goal that is never stated has no chance of being reached.
  es: Las tres últimas propuestas chocarán con el veto de aquellos a quienes se dirigen. Las defendemos igualmente, porque un objetivo que se renuncia a formular no tiene ninguna posibilidad de alcanzarse.
temps:
- nom:
    fr: Premiers temps
    en: First stage
    es: Primeros tiempos
  resume:
    fr: 'Réalisable dès maintenant : s’appuie sur des institutions qui existent déjà, sans révision de la Charte.'
    en: Achievable now, building on existing institutions without amending the Charter.
    es: 'Realizable desde ahora: se apoya en instituciones que ya existen, sin revisar la Carta.'
  propositions:
  - numero: 1
    titre:
      fr: Donner toute leur place aux ONG
      en: Give NGOs their full place
      es: Dar a las ONG el lugar que les corresponde
    texte:
      fr: Rehausser le statut des ONG dans les instances de l’ONU et pérenniser les Forums mondiaux des ONG, en s’appuyant sur des pratiques établies, du Comité de liaison ONG-UNESCO à l’ECOSOC.
      en: Raise the status of NGOs in UN bodies and make the NGO World Forums permanent, building on established practice from the NGO-UNESCO Liaison Committee to ECOSOC.
      es: Elevar el estatus de las ONG en los órganos de la ONU y hacer permanentes los Foros Mundiales de ONG, apoyándose en prácticas establecidas, desde el Comité de Enlace ONG-UNESCO hasta el ECOSOC.
  - numero: 2
    titre:
      fr: Transparence financière des OING
      en: Financial transparency for INGOs
      es: Transparencia financiera de las OING
    texte:
      fr: Instaurer pour les organisations internationales non gouvernementales des normes de transparence financière inspirées du GAFI.
      en: Introduce FATF-style financial transparency standards for international non-governmental organisations.
      es: Establecer para las organizaciones internacionales no gubernamentales normas de transparencia financiera inspiradas en el GAFI.
  - numero: 3
    titre:
      fr: Soutenir la démocratie représentative
      en: Support representative democracy
      es: Apoyar la democracia representativa
    texte:
      fr: Permettre à l’Union interparlementaire, qui réunit à Genève des parlementaires du monde entier, de soumettre chaque année une proposition de loi aux assemblées nationales.
      en: Allow the Inter-Parliamentary Union, which gathers parliamentarians from around the world in Geneva, to submit one legislative proposal a year to national parliaments.
      es: Permitir que la Unión Interparlamentaria, que reúne en Ginebra a parlamentarios de todo el mundo, presente cada año una propuesta de ley a los parlamentos nacionales.
  - numero: 4
    titre:
      fr: Réguler le numérique et l’IA
      en: Regulate digital technology and AI
      es: Regular lo digital y la IA
    texte:
      fr: Une régulation internationale du numérique et de l’intelligence artificielle, y compris militaire, qui place la dignité humaine au cœur du dispositif.
      en: International regulation of digital technology and artificial intelligence, including military uses, with human dignity at its core.
      es: Una regulación internacional de lo digital y de la inteligencia artificial, incluida la militar, que sitúe la dignidad humana en el centro.
  - numero: 5
    titre:
      fr: Sécurité humaine et normes communes
      en: Human security and shared standards
      es: Seguridad humana y normas comunes
    texte:
      fr: Promouvoir la sécurité humaine, au sens du PNUD de 1994, par des normes commerciales sociales et environnementales contraignantes, en mobilisant l’ECOSOC, l’OIT, l’OMC et le PNUE.
      en: Promote human security, as defined by UNDP in 1994, through binding social and environmental trade standards, drawing on ECOSOC, the ILO, the WTO and UNEP.
      es: Promover la seguridad humana, en el sentido del PNUD de 1994, mediante normas comerciales sociales y medioambientales vinculantes, movilizando el ECOSOC, la OIT, la OMC y el PNUMA.
- nom:
    fr: Seconds temps
    en: Second stage
    es: Segundos tiempos
  resume:
    fr: Réalisable en droit, difficile en politique.
    en: Legally possible, politically difficult.
    es: Posible en derecho, difícil en política.
  propositions:
  - numero: 6
    titre:
      fr: Casques bleus et voie diplomatique
      en: Peacekeeping and diplomacy first
      es: Cascos azules y vía diplomática
    texte:
      fr: Renforcer le recours aux casques bleus et privilégier le règlement diplomatique et judiciaire des conflits.
      en: Make greater use of UN peacekeepers and favour diplomatic and judicial settlement of conflicts.
      es: Recurrir más a los cascos azules y dar prioridad a la solución diplomática y judicial de los conflictos.
  - numero: 7
    titre:
      fr: Embargo sur les armes
      en: Arms embargoes
      es: Embargo de armas
    texte:
      fr: Privilégier l’embargo sur les armes contre un État agresseur, plutôt que des sanctions économiques qui frappent d’abord les populations civiles.
      en: Favour arms embargoes against an aggressor state over economic sanctions that hit civilians first.
      es: Dar prioridad al embargo de armas contra un Estado agresor, en lugar de sanciones económicas que golpean primero a la población civil.
  - numero: 8
    titre:
      fr: Une institution mondiale pour le climat
      en: A world institution for the climate
      es: Una institución mundial para el clima
    texte:
      fr: Fonder une institution mondiale et permanente pour l’environnement et le climat, inspirée des COP mais dotée de moyens contraignants.
      en: Create a permanent world institution for the environment and the climate, modelled on the COPs but with binding powers.
      es: Crear una institución mundial y permanente para el medio ambiente y el clima, inspirada en las COP pero dotada de medios vinculantes.
- nom:
    fr: Troisièmes temps
    en: Third stage
    es: Terceros tiempos
  resume:
    fr: 'Nos propositions phares : elles demandent une révision de la Charte.'
    en: 'Our flagship proposals: they require a review of the Charter.'
    es: 'Nuestras propuestas emblemáticas: requieren una revisión de la Carta.'
  propositions:
  - numero: 9
    titre:
      fr: Secrétaire général et Assemblée générale
      en: Secretary-General and General Assembly
      es: Secretario General y Asamblea General
    texte:
      fr: Permettre au Secrétaire général de faire adopter par l’Assemblée générale, à la majorité des deux tiers, une résolution surmontant un blocage du Conseil de sécurité sur les questions du Chapitre VII.
      en: Allow the Secretary-General to have the General Assembly adopt, by a two-thirds majority, a resolution overcoming a Security Council deadlock on Chapter VII matters.
      es: Permitir que el Secretario General haga adoptar por la Asamblea General, por mayoría de dos tercios, una resolución que supere un bloqueo del Consejo de Seguridad en asuntos del Capítulo VII.
  - numero: 10
    titre:
      fr: Un Conseil de sécurité représentatif
      en: A representative Security Council
      es: Un Consejo de Seguridad representativo
    texte:
      fr: 'Revoir la composition des membres permanents pour refléter les blocs régionaux réels, en intégrant le Sud global : Afrique, Amérique latine, Asie, pays arabes.'
      en: 'Reform permanent membership to reflect real regional blocs, bringing in the Global South: Africa, Latin America, Asia and the Arab states.'
      es: 'Revisar la composición de los miembros permanentes para reflejar los bloques regionales reales, integrando al Sur global: África, América Latina, Asia y los países árabes.'
  - numero: 11
    titre:
      fr: Suspendre le droit de veto
      en: Suspend the veto
      es: Suspender el derecho de veto
    texte:
      fr: Suspendre le veto d’un membre permanent qui commet des atrocités de masse ou une agression, en élargissant l’article 27-3 de la Charte. Une initiative franco-mexicaine, soutenue par une centaine d’États, va déjà dans ce sens.
      en: Suspend the veto of a permanent member that commits mass atrocities or aggression, by extending Article 27(3) of the Charter. A French-Mexican initiative backed by around a hundred states already points this way.
      es: Suspender el veto de un miembro permanente que cometa atrocidades masivas o una agresión, ampliando el artículo 27-3 de la Carta. Una iniciativa franco-mexicana, apoyada por un centenar de Estados, ya va en este sentido.
