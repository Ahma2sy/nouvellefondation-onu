# Les 11 propositions, classées en trois temps (frise prospective). Textes en fr, en, es.

titre:
  fr: Onze propositions, trois temps
  en: Eleven proposals, three stages
  es: Once propuestas, tres tiempos
intro:
  fr: 'Un catalogue de propositions ne dit rien de leur faisabilité. Notre *frise prospective chronologique* classe donc les nôtres selon ce qu’elles exigent du droit existant : certaines s’appuient sur des institutions déjà en place, d’autres se heurtent à des intérêts d’États, les dernières supposent d’amender la Charte, ce qui requiert une majorité des deux tiers à l’Assemblée générale et l’accord des cinq membres permanents du Conseil de sécurité.'
  en: 'A list of proposals says nothing about whether they can happen. Our *prospective chronological timeline* therefore orders ours by what they require of existing law: some build on institutions already in place, others run up against state interests, and the last ones require amending the Charter, which needs a two-thirds majority in the General Assembly and the agreement of the five permanent members of the Security Council.'
  es: 'Un catálogo de propuestas no dice nada sobre su viabilidad. Por eso nuestra *cronología prospectiva* las ordena según lo que exigen del derecho vigente: algunas se apoyan en instituciones ya existentes, otras chocan con intereses de los Estados y las últimas requieren enmendar la Carta, lo que exige una mayoría de dos tercios en la Asamblea General y el acuerdo de los cinco miembros permanentes del Consejo de Seguridad.'
