        description: { fr: Réseau catholique international pour la paix, en: International Catholic peace network }
        url: https://paxchristi.net/
      - nom: Mouvement de la Paix
        description: { fr: Association française pour la paix et le désarmement, en: French association for peace and disarmament }
        url: https://www.mvtpaix.org/
      - nom: MIAMSI
        description: { fr: Mouvement international d’apostolat des milieux sociaux indépendants, en: International Movement of Apostolate in the Independent Social Milieus }
        url: http://www.miamsi-rome.org/
      - nom: Université Européenne de la Paix
        description: { fr: "Éducation à la paix, Brest", en: "Peace education, Brest" }
        url: https://www.uep.infini.fr/

