# Page « Le projet »

titre: { fr: Le projet, en: The project }
intro:
  fr: Une coalition d’ONG et de juristes de droit international qui appelle à réformer la Charte des Nations unies.
  en: A coalition of NGOs and international lawyers calling for a reform of the UN Charter.

paragraphes:
  - fr: Le projet Nouvelle Fondation est né des ateliers Chemins de Paix du Centre catholique international de coopération avec l’UNESCO (CCIC), à l’initiative de Pax Christi International. Il est accueilli par Pax Christi France, qui propose de travailler un texte appelant à la réforme de la Charte de l’ONU et des institutions internationales.
    en: The New Foundation project grew out of the Paths of Peace workshops of the International Catholic Centre for Cooperation with UNESCO (CCIC), on the initiative of Pax Christi International. It is hosted by Pax Christi France, which set out to draft a text calling for reform of the UN Charter and international institutions.
  - fr: "Sa méthode est celle d’ICAN, la campagne internationale pour l’abolition des armes nucléaires, prix Nobel de la paix 2017 : faire circuler un texte, rassembler le plus grand nombre de signatures d’organisations, puis le porter dans les médias et auprès des cercles politiques nationaux et multilatéraux."
    en: "Its method is that of ICAN, the International Campaign to Abolish Nuclear Weapons, winner of the 2017 Nobel Peace Prize: circulate a text, gather as many organisational signatures as possible, then take it to the media and to national and multilateral policy circles."
  - fr: Nous soutenons la réforme UN80 du Secrétaire général et demandons que ce travail s’élargisse jusqu’à repenser l’architecture même des Nations unies. Nouvelle Fondation collabore avec le Bureau international de la paix (IPB) et fait partie de la coalition Article 109 pour la révision de la Charte.
    en: We support the Secretary-General’s UN80 reform and call for this work to go further, to rethink the very architecture of the United Nations. New Foundation works with the International Peace Bureau (IPB) and is a member of the Article 109 coalition for a review of the Charter.

