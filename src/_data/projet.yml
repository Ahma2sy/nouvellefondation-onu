# Page « Le projet » : histoire, Bureau, personnalités, encouragement moral, documents (fr, en, es)

titre:
  fr: Le projet
  en: The project
  es: El proyecto
intro:
  fr: Une coalition d’ONG et de juristes de droit international qui appelle à réformer la Charte des Nations unies.
  en: A coalition of NGOs and international lawyers calling for a reform of the UN Charter.
  es: Una coalición de ONG y juristas de derecho internacional que pide reformar la Carta de las Naciones Unidas.
paragraphes:
- fr: Le projet Nouvelle Fondation est né des ateliers Chemins de Paix du Centre catholique international de coopération avec l’UNESCO (CCIC), à l’initiative de Ghislain Le Ray, de Pax Christi International. Il est accueilli par Pax Christi France, qui propose de travailler un texte appelant à la réforme de la Charte de l’ONU et des institutions internationales.
  en: The New Foundation project grew out of the Paths of Peace workshops of the International Catholic Centre for Cooperation with UNESCO (CCIC), on the initiative of Ghislain Le Ray of Pax Christi International. It is hosted by Pax Christi France, which set out to draft a text calling for reform of the UN Charter and international institutions.
  es: El proyecto Nueva Fundación nació de los talleres Caminos de Paz del Centro Católico Internacional de Cooperación con la UNESCO (CCIC), por iniciativa de Ghislain Le Ray, de Pax Christi Internacional. Está acogido por Pax Christi Francia, que propuso elaborar un texto que llama a reformar la Carta de la ONU y las instituciones internacionales.
- fr: 'Sa méthode est celle d’ICAN, la campagne internationale pour l’abolition des armes nucléaires, prix Nobel de la paix 2017 : faire circuler un texte, rassembler le plus grand nombre de signatures d’organisations, puis le porter dans les médias et auprès des cercles politiques nationaux et multilatéraux.'
  en: 'Its method is that of ICAN, the International Campaign to Abolish Nuclear Weapons, winner of the 2017 Nobel Peace Prize: circulate a text, gather as many organisational signatures as possible, then take it to the media and to national and multilateral policy circles.'
  es: 'Su método es el de ICAN, la Campaña Internacional para Abolir las Armas Nucleares, premio Nobel de la Paz 2017: hacer circular un texto, reunir el mayor número posible de firmas de organizaciones y luego llevarlo a los medios y a los círculos políticos nacionales y multilaterales.'
- fr: Nous soutenons la réforme UN80 du Secrétaire général et demandons que ce travail s’élargisse jusqu’à repenser l’architecture même des Nations unies. Nouvelle Fondation collabore avec le Bureau international de la paix (IPB) et fait partie de la coalition Article 109 pour la révision de la Charte.
  en: We support the Secretary-General’s UN80 reform and call for this work to go further, to rethink the very architecture of the United Nations. New Foundation works with the International Peace Bureau (IPB) and is a member of the Article 109 coalition for a review of the Charter.
  es: Apoyamos la reforma UN80 del Secretario General y pedimos que este trabajo se amplíe hasta repensar la arquitectura misma de las Naciones Unidas. Nueva Fundación colabora con la Oficina Internacional de la Paz (IPB) y forma parte de la coalición Article 109 por la revisión de la Carta.
