  alt:
    fr: Cinq membres du projet debout dans une salle de réunion au siège de Pax Christi France
    en: Five project members standing in a meeting room at Pax Christi France headquarters
    es: Cinco miembros del proyecto de pie en una sala de reuniones en la sede de Pax Christi Francia
  legende:
    fr: 'Lancement du projet en octobre 2024, au siège de Pax Christi France. De gauche à droite : Marc Deluzet (MIAMSI), Michel Kahla (PCI), Vlatko Maric (Pax Christi France), Ghislain Le Ray (Pax Christi International), Alain Rouy (Mouvement de la Paix, IPB). À distance : Farah Sakr et Marilyn Pacouret. Photo : Yann Henry.'
    en: 'Project launch in October 2024 at Pax Christi France headquarters. From left: Marc Deluzet (MIAMSI), Michel Kahla (PCI), Vlatko Maric (Pax Christi France), Ghislain Le Ray (Pax Christi International), Alain Rouy (Mouvement de la Paix, IPB). Online: Farah Sakr and Marilyn Pacouret. Photo: Yann Henry.'
    es: 'Lanzamiento del proyecto en octubre de 2024, en la sede de Pax Christi Francia. De izquierda a derecha: Marc Deluzet (MIAMSI), Michel Kahla (PCI), Vlatko Maric (Pax Christi Francia), Ghislain Le Ray (Pax Christi Internacional), Alain Rouy (Mouvement de la Paix, IPB). A distancia: Farah Sakr y Marilyn Pacouret. Foto: Yann Henry.'
